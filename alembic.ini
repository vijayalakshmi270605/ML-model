[alembic]
script_location = src/ad_mri/db/migrations
prepend_sys_path = . src
version_path_separator = os

# sqlalchemy.url is NOT set here — it is injected at runtime from Settings
# (DATABASE_URL / POSTGRES_* environment variables) by src/ad_mri/db/migrations/env.py,
# so no credential or environment-specific path ever lives in this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
