name: CI

# Triggers on both `main` and `master` since this repository's default branch
# name isn't fixed yet (see docs/deployment.md) — harmless if only one exists.
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  # 1 (install) + 2 (lint): fast, dependency-light checks that gate everything
  # heavier below — a formatting/import-order mistake fails in under a
  # minute, not after a multi-minute torch install.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check src tests

      - name: black --check
        run: black --check src tests

  # 3: type checking. Independent of `train` extras — every heavy/optional
  # dependency (torch, monai, ...) is imported lazily inside functions
  # throughout src/, exactly so `mypy src` never needs them installed.
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: mypy
        run: mypy src

  # 6: security checks. Independent of `train` extras too — runs alongside
  # lint/type-check rather than after them, so a dependency-vulnerability
  # finding is visible immediately, not only after a slow test run.
  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: bandit (SAST)
        run: bandit -c pyproject.toml -r src

      - name: pip-audit (dependency vulnerabilities)
        # --skip-editable: this project's own editable install (`ad-mri`) has
        # no PyPI entry to check vulnerabilities against by definition.
        run: pip-audit --skip-editable

  # 4: unit tests (tests/unit, tests/api, tests/data_validation,
  # tests/explainability). Needs the `train` extra — most of this codebase's
  # "unit" tests exercise real model/checkpoint/inference code, which needs
  # torch/monai installed, not mocked.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,train]"

      - name: pytest (unit)
        run: >
          pytest tests/unit tests/api tests/data_validation tests/explainability
          --cov=ad_mri --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-unit
          path: coverage.xml
          retention-days: 14

  # 5: integration tests (tests/integration) — real FastAPI TestClient calls
  # against a real (SQLite-backed, see db.types.GUID) checkpoint/database; no
  # separate Postgres service container is needed for this suite (see
  # docs/database.md §3/§9).
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,train]"

      - name: pytest (integration)
        run: pytest tests/integration -v

  # 7: build the Docker image(s) — only after every check above passes.
  # Pushes to GHCR (using the workflow's own auto-issued GITHUB_TOKEN, never
  # a stored secret — see docs/deployment.md §Secrets management) only on a
  # push to the default branch; a pull request build is validated (and image-
  # scanned) but never published.
  docker-build:
    name: Build image (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, training, mlflow]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        run: |
          echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          # Loaded into the local docker daemon (needed for the Trivy scan
          # step below) even when not pushed; pushed to GHCR only on push
          # events, never for a pull request build.
          load: true
          push: false
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lc }}-${{ matrix.image }}:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.repo_lc }}-${{ matrix.image }}:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.short_sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image for vulnerabilities (Trivy)
        # Pinned to a commit SHA, not a mutable tag — a third-party action
        # with `packages: write`/registry-push access nearby in this job is
        # exactly the kind of supply-chain surface worth pinning immutably.
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2  # v0.28.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.repo_lc }}-${{ matrix.image }}:${{ steps.meta.outputs.short_sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push ${{ matrix.image }} image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lc }}-${{ matrix.image }}:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.repo_lc }}-${{ matrix.image }}:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.short_sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=${{ matrix.image }}
